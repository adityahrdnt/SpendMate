services:
  postgres:
    image: postgres:17
    container_name: spendmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendmate
      POSTGRES_USER: spendmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - spendmate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendmate -d spendmate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spendmate-postgres-data:
