name: SpendMate CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SpendMate.slnx

      - name: Build solution
        run: dotnet build SpendMate.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SpendMate.slnx --configuration Release --no-build

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/spendmate-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/spendmate-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build
